version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Internal URL for Next.js to reach FastAPI via Docker's internal network
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Allow all origins inside Docker for cross-container / proxy communication
      - ALLOWED_ORIGINS=*
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
