name: marketlens-prod

services:
  marketlens-backend:
    image: registry.acimisai.com/marketlens-backend:${IMAGE_TAG:-v1}
    platform: linux/amd64
    container_name: marketlens_backend_prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - PORT=${BACKEND_PORT:-8000}
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request, os; urllib.request.urlopen(\"http://127.0.0.1:\" + str(os.environ.get(\"PORT\", 8000)) + \"/openapi.json\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      marketlens-net:
        aliases:
          - backend

  marketlens-frontend:
    image: registry.acimisai.com/marketlens-frontend:${IMAGE_TAG:-v1}
    platform: linux/amd64
    container_name: marketlens_frontend_prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      - PORT=${FRONTEND_PORT:-3000}
      - BACKEND_URL=${BACKEND_URL:-http://backend:${BACKEND_PORT:-8000}}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      marketlens-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$$PORT/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      marketlens-net:
        aliases:
          - frontend

  marketlens-prometheus:
    image: prom/prometheus:latest
    container_name: marketlens_prometheus_prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      marketlens-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - marketlens-net
    profiles:
      - monitoring

  marketlens-grafana:
    image: grafana/grafana:latest
    container_name: marketlens_grafana_prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      marketlens-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - marketlens-net
    profiles:
      - monitoring

  marketlens-nginx:
    image: nginx:alpine
    container_name: marketlens_nginx_prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${NGINX_PORT:-8081}:80"
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      marketlens-frontend:
        condition: service_healthy
      marketlens-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - marketlens-net
      - acimisai_tunnel_network

networks:
  marketlens-net:
    name: marketlens-net
    driver: bridge

  acimisai_tunnel_network:
    name: acimisai_tunnel_network
    external: true
