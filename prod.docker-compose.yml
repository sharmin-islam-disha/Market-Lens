name: marketlens-prod

services:
  marketlens-backend:
    image: registry.acimisai.com/marketlens-backend:${VERSION}
    container_name: marketlens_prod_backend
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - marketlens_uploads:/app/uploads
    networks:
      - marketlens-net
      - pg_central_net
      - monitoring_central_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  marketlens-frontend:
    image: registry.acimisai.com/marketlens-frontend:${VERSION}
    container_name: marketlens_prod_frontend
    restart: unless-stopped
    env_file: ./.env
    networks:
      - marketlens-net
    depends_on:
      marketlens-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  marketlens-nginx:
    image: nginx:alpine
    container_name: marketlens_prod_nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      marketlens-frontend:
        condition: service_healthy
    networks:
      - marketlens-net
      - acimisai_tunnel_network

volumes:
  marketlens_uploads:

networks:
  marketlens-net:
    driver: bridge
    internal: false
  acimisai_tunnel_network:
    external: true
  pg_central_net:
    external: true
  monitoring_central_net:
    external: true
